spring.application.name=YOUMP3API
server.port=${PORT:8088}

logging.pattern.console=%d{yyyy-MM-dd_HH:mm} %-5level [YOUMP3API] [%thread] %logger{36} - %msg%n

logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR

ytdlp.cookies-path=${YTDLP_COOKIES_PATH:/app/cookies.txt}
ytdlp.cookies-required=${YTDLP_COOKIES_REQUIRED:true}
ytdlp.pot-enabled=${YTDLP_POT_ENABLED:true}
ytdlp.pot-provider-url=${YTDLP_POT_PROVIDER_URL:http://127.0.0.1:4416}
ytdlp.proxy=${YTDLP_PROXY:}
ytdlp.attempt-timeout-seconds=${YTDLP_ATTEMPT_TIMEOUT_SECONDS:90}
ytdlp.extraction-timeout-seconds=${YTDLP_EXTRACTION_TIMEOUT_SECONDS:180}
ytdlp.search-timeout-seconds=${YTDLP_SEARCH_TIMEOUT_SECONDS:60}
ytdlp.max-duration-seconds=${YTDLP_MAX_DURATION_SECONDS:900}
ytdlp.search-limit=${YTDLP_SEARCH_LIMIT:15}
ytdlp.player-clients=${YTDLP_PLAYER_CLIENTS:tv_embedded,web_safari,ios,android_vr}

youtube.data-api.enabled=${YOUTUBE_API_SEARCH_ENABLED:true}
youtube.data-api.api-key=${YOUTUBE_API_KEY:}
youtube.data-api.max-results=${YOUTUBE_API_MAX_RESULTS:15}
youtube.data-api.max-duration-seconds=${YOUTUBE_API_MAX_DURATION_SECONDS:900}
youtube.data-api.cache-ttl=${YOUTUBE_API_CACHE_TTL:10m}
youtube.data-api.timeout=${YOUTUBE_API_TIMEOUT:10s}
